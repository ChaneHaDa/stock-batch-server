spring.application.name=stock-batch-server
# port
server.port=9090
# Spring Boot Batch Auto-Configuration 비활성화
spring.batch.job.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
# swagger-ui docs
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/api/v3
# Primary DataSource - PostgreSQL (비즈니스 데이터)
spring.datasource.primary.url=jdbc:postgresql://localhost:5432/test1
spring.datasource.primary.username=postgres
spring.datasource.primary.password=1234
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# Batch DataSource - H2 (인메모리)
spring.datasource.batch.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.batch.username=sa
spring.datasource.batch.password=
spring.datasource.batch.driver-class-name=org.h2.Driver

# Flyway 설정 (PostgreSQL만)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:postgresql://localhost:5432/test1
spring.flyway.user=postgres
spring.flyway.password=1234

# JPA PostgreSQL 설정 (Primary DataSource 사용)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Spring Batch H2 설정
spring.batch.initialize-schema=always
spring.batch.table-prefix=BATCH_
# file
file.upload-dir=${UPLOAD_DIR:./inbound}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# KRX 데이터 경로 설정
krx.data.path=${KRX_DATA_PATH:../krx-json-data-test}

# logging
logging.level.com.chan.stock_batch_server=INFO
logging.level.org.springframework.batch=INFO